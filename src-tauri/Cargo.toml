[package]
name = "atril"
version = "0.1.0"
description = "Minimalist PDF reader with a library"
authors = ["GabJS10"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "atril_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.21"
tracing = "0.1.44"
dirs = "7.0.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sha2 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
walkdir = "2.5.0"
notify = "8.2.0"
percent-encoding = "2.3.2"
unicode-normalization = "0.1.25"
uuid = { version = "1.28.0", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# JPEG 2000 de los PDF (src/jpx.rs). Sin features por defecto ni `simd`: sin `unsafe` en ninguna dependencia.
hayro-jpeg2000 = { version = "0.4.1", default-features = false, features = ["std"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
