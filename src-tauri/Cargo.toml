[package]
name = "atril-libros"
version = "1.0.1"
description = "A quiet desktop reader for your PDF books"
authors = ["GabJS10"]
license = "AGPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "atril_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.21"
tracing = "0.1.44"
dirs = "7.0.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sha2 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
walkdir = "2.5.0"
notify = "8.2.0"
percent-encoding = "2.3.2"
unicode-normalization = "0.1.25"
uuid = { version = "1.28.0", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# Motor de PDF nativo (fase R, src/engine/). MuPDF se compila desde fuente y se enlaza estático; `mupdf-sys`
# necesita libclang para bindgen. Sin `system-fonts` (con fuentes no incrustadas tardaba ~20 s por libro) y
# con `base14-fonts` (sin ellas el texto se extrae mal). Atril pasa a AGPL por esta dependencia.
mupdf = { version = "0.8.0", default-features = false, features = ["base14-fonts"] }
# Mismas features que `mupdf` (`zerocopy`, `base14-fonts`) para que no se recompile MuPDF. Solo `engine/raw.rs` la usa:
# recortar el store de recursos de MuPDF (`fz_shrink_store`), algo que el crate `mupdf` 0.8 no expone.
mupdf-sys = { version = "0.8.0", default-features = false, features = ["zerocopy", "base14-fonts"] }
# Codificación JPEG de las páginas renderizadas (Rust puro; `simd` = AVX2 con detección en tiempo de ejecución).
jpeg-encoder = { version = "0.6", features = ["simd"] }
# Indexador nativo (src/indexer.rs): limpieza de título y autor.
regex = "1"
# Color dominante de las portadas que ya existen (src/cover_color.rs): decodifica `covers/<id>.jpg` (o .webp) sin
# MuPDF. Rust puro (zune-jpeg, image-webp), sin dependencias del sistema.
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }
# Indexador nativo: `setpriority` sobre el hilo de indexado (Linux) para que el render del visor gane la CPU.
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# unwind (no abort): el pool de render y la búsqueda (`engine/pool.rs`, `engine/search.rs`) atrapan los pánicos con
# `catch_unwind` para que un PDF raro no tire la app.
panic = "unwind"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
